<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MoneyMap • Daily Spending Heatmap</title>
    <link rel="stylesheet" href="./heatmap.css" />
  </head>
  <body>
    <main class="page">
      <header class="header">
        <div>
          <h1 class="title">Daily Spending Heatmap</h1>
          <p class="subtitle">
            GitHub-style view of spending intensity for the current month.
          </p>
        </div>
        <div class="legend" aria-label="Spending intensity legend">
          <span class="legend-label">Less</span>
          <span class="legend-swatch level-0" title="₹0"></span>
          <span class="legend-swatch level-1" title="₹1–₹200"></span>
          <span class="legend-swatch level-2" title="₹200–₹500"></span>
          <span class="legend-swatch level-3" title="₹500+"></span>
          <span class="legend-label">More</span>
        </div>
      </header>

      <section class="card">
        <div class="card-head">
          <div class="month-title" id="monthTitle">Current month</div>
          <div class="meta" id="monthMeta"></div>
        </div>

        <div class="heatmap-wrap">
          <div class="weekday-labels" aria-hidden="true">
            <div class="weekday">Mon</div>
            <div class="weekday">Wed</div>
            <div class="weekday">Fri</div>
          </div>

          <div class="heatmap-scroller">
            <div id="heatmap" class="heatmap" aria-label="Daily spending heatmap"></div>
          </div>
        </div>

        <div id="tooltip" class="tooltip" role="tooltip" aria-hidden="true"></div>
      </section>

      <section class="card">
        <div class="card-head">
          <div class="month-title">Sample data</div>
          <div class="meta">Edit `sampleTransactions` in `heatmap.js`.</div>
        </div>
        <pre class="code" id="samplePreview"></pre>
      </section>
    </main>

    <script src="./heatmap.js"></script>
  </body>
</html>
